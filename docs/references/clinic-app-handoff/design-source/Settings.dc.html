<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin and settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1A4FB5}
button,input{font-family:inherit;font-variant-numeric:tabular-nums}
input:focus{outline:none;border-bottom-color:#1A4FB5 !important}
button:focus-visible,a:focus-visible{outline:2px solid #1A4FB5;outline-offset:2px;border-radius:6px}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #141C2B; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums">
<dc-import name="Nav" active="more" user="Dr. G. P. Kirupakaran" token="15" waiting="6" hint-size="100%,56px"></dc-import>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; min-height: calc(100vh - 56px)">
<nav aria-label="Settings" style="flex: 1 1 240px; max-width: 280px; min-width: 0; align-self: stretch; box-sizing: border-box; padding: 32px 24px; background: #F6F7F9; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 18px; margin-bottom: 4px">Settings</span>
<span style="font-size: 13px; color: #7A8494; margin-bottom: 12px">Doctor only</span>
<sc-for list="{{sections}}" as="sc" hint-placeholder-count="7">
<button type="button" onClick="{{sc.pick}}" style="height: 38px; padding: 0 12px; margin: 0 -12px; border: 0; border-radius: 8px; text-align: left; font-size: 15px; cursor: pointer; {{sc.st}}">{{sc.label}}</button>
</sc-for>
</nav>

<main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 32px 36px 48px">
<div style="max-width: 820px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 700; font-size: 24px; letter-spacing: -0.01em">{{title}}</span>
<span style="font-size: 14px; {{savedSt}}">{{savedText}}</span>
</div>
<span style="font-size: 14px; color: #5B6575; margin-top: -14px">{{intro}}</span>

<!-- generic field grid -->
<sc-if value="{{hasFields}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 18px 28px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<label style="display: flex; flex-direction: column; gap: 4px; {{f.span}}"><span style="font-size: 13px; color: #7A8494">{{f.label}}</span><input type="text" value="{{f.value}}" onChange="{{markDirty}}" style="height: 38px; padding: 0; border: 0; border-bottom: 1px solid #DDE1E7; background: transparent; font-size: 15px; color: #141C2B"></label>
</sc-for>
</div>
</sc-if>

<!-- rows -->
<sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid #EEF0F3">
<span style="flex: 1 1 260px; display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">{{r.title}}</span><span style="font-size: 14px; color: #5B6575">{{r.detail}}</span></span>
<span style="font-weight: 600; {{r.rightSt}}">{{r.right}}</span>
<button type="button" onClick="{{markDirty}}" style="height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #1A4FB5; font-size: 14px; font-weight: 600; cursor: pointer">{{r.action}}</button>
</div>
</sc-for>
</div>
<button type="button" onClick="{{markDirty}}" style="align-self: flex-start; height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: #F2F4F7; color: #141C2B; font-weight: 600; font-size: 14px; cursor: pointer">{{addLabel}}</button>
</sc-if>

<!-- permissions -->
<sc-if value="{{isStaff}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 14px; background: #F6F7F9">
<span style="font-weight: 600">What reception can do</span>
<sc-for list="{{perms}}" as="pm" hint-placeholder-count="7">
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; {{pm.st}}">
<input type="checkbox" checked="{{pm.on}}" disabled="{{pm.locked}}" onChange="{{pm.toggle}}" style="width: 18px; height: 18px; accent-color: #1A4FB5">
{{pm.label}}
</label>
</sc-for>
</div>
</sc-if>

<!-- print -->
<sc-if value="{{isPrint}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{printOpts}}" as="po" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px">
<span style="width: 190px; font-size: 14px; color: #5B6575">{{po.label}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 2px; margin-left: -12px">
<sc-for list="{{po.opts}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; {{o.st}}">{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-for>
<a href="Minimal.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none">See it on a prescription →</a>
</div>
</sc-if>

<sc-if value="{{dirty}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{save}}" style="height: 42px; padding: 0 18px; border: 0; border-radius: 10px; background: #1A4FB5; color: #FFFFFF; font-weight: 600; font-size: 14px; cursor: pointer">Save changes</button>
<button type="button" onClick="{{discard}}" style="height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #5B6575; font-size: 14px; cursor: pointer">Discard</button>
</div>
</sc-if>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
var AMB = 'color: #93520A', GRN = 'color: #1F7A4D', MUTED = 'color: #5B6575';
var SECTIONS = {
  clinic: { label: 'Clinic information', intro: 'Shown on prescriptions, receipts and the sign-in screen.',
    fields: [['Clinic name', 'Salem Pain & Palliative Care Clinic', 1], ['Tagline', 'Interventional Pain Management Centre', 1], ['Address', '108, Swarnapuri Annex, Near ANS Divyam, Omalur Main Road, Salem 636 004', 1], ['Phone', '90955 96999'], ['Clinic hours', 'Mon–Sat · 9:30 am – 1:30 pm, 5 – 8 pm'], ['GSTIN', '[GSTIN, if registered]'], ['Doctor registration no.', '[TNMC reg. no.]']] },
  staff: { label: 'Staff & access', intro: 'Each person signs in with their own PIN so every bill and stock change is traceable.',
    rows: [{ title: 'Dr. G. P. Kirupakaran', detail: 'Doctor · full access · signs prescriptions, sets prices and discounts', right: 'Active', rightSt: GRN, action: 'Change PIN' },
      { title: 'Selvi', detail: 'Reception · front desk computer', right: 'Active · now', rightSt: GRN, action: 'Edit' },
      { title: 'Anand', detail: 'Reception · part-time, evenings', right: 'Last in 9 Oct', rightSt: MUTED, action: 'Edit' }], add: 'Add staff member' },
  meds: { label: 'Medicines & prices', intro: 'Patient prices used for every bill. Reception can see them but not change them.',
    rows: [{ title: 'Pregabid 75 mg · cap', detail: 'Pregabalin · reorder at 100 · default 0-0-1, 15 days', right: '₹14.50', action: 'Edit' },
      { title: 'Nurokind-OD 1500 mcg · tab', detail: 'Methylcobalamin · reorder at 100 · default 1-0-0, 30 days', right: '₹9.80', action: 'Edit' },
      { title: 'Ultracet 37.5/325 · tab', detail: 'Tramadol + Paracetamol · reorder at 50 · flag: interaction checks', right: '₹12.00', action: 'Edit' },
      { title: 'Zerodol-P · tab', detail: 'Aceclofenac + Paracetamol · NSAID — allergy check on', right: '₹4.60', action: 'Edit' },
      { title: 'Lactulose syrup 200 ml · bottle', detail: 'Reorder at 10', right: '₹186.00', action: 'Edit' }], add: 'Add medicine' },
  proc: { label: 'Procedures & fees', intro: 'Fixed charges the doctor can add to a visit.',
    rows: [{ title: 'Consultation · new patient', detail: 'First visit', right: '₹400', action: 'Edit' },
      { title: 'Consultation · follow-up', detail: 'Within 60 days of last visit', right: '₹300', action: 'Edit' },
      { title: 'Trigger point injection', detail: 'Per site · includes needle and drug', right: '₹800', action: 'Edit' },
      { title: 'Genicular nerve block', detail: 'Ultrasound guided', right: '₹2,500', action: 'Edit' },
      { title: 'Dressing', detail: 'Palliative wound care', right: '₹150', action: 'Edit' }], add: 'Add procedure' },
  tpl: { label: 'Prescription templates', intro: 'Saved sets the doctor can add with one search. Doses and days are filled in automatically.',
    rows: [{ title: 'Neuropathy start', detail: 'Pregabid 75 0-0-1 × 15 d · Nurokind-OD 1-0-0 × 30 d', right: 'Used 34×', rightSt: MUTED, action: 'Edit' },
      { title: 'Acute low back pain', detail: 'Myoril 4 1-0-1 × 5 d · Ultracet SOS × 5 d · Pan 40 1-0-0 × 5 d', right: 'Used 51×', rightSt: MUTED, action: 'Edit' },
      { title: 'Neuropathic pain + sleep', detail: 'Duzela 20 0-0-1 × 30 d · Amitone 10 0-0-½ × 15 d', right: 'Used 12×', rightSt: MUTED, action: 'Edit' },
      { title: 'Advice · diabetic foot care', detail: 'Text block for the advice field', right: 'Used 28×', rightSt: MUTED, action: 'Edit' }], add: 'New template' },
  print: { label: 'Print settings', intro: 'Prescriptions print on your letterhead; receipts on the small receipt printer.' },
  backup: { label: 'Backup & offline', intro: 'Everything is saved on this computer first, then copied to the cloud.',
    rows: [{ title: 'Cloud copy', detail: 'Last copied 11:04 today · automatic every 5 minutes', right: 'Up to date', rightSt: GRN, action: 'Copy now' },
      { title: 'Offline mode', detail: 'Check-in, prescriptions, billing and printing keep working without internet. Changes sync when back online.', right: 'On', rightSt: GRN, action: 'Details' },
      { title: 'Daily backup to USB', detail: 'Last: 9 Oct, 8:12 pm · drive "CLINIC-BKP"', right: 'OK', rightSt: GRN, action: 'Run now' },
      { title: 'Second computer', detail: 'Doctor’s room PC · paired', right: 'Connected', rightSt: GRN, action: 'Manage' }], add: 'Restore from backup' }
};
var ORDER = ['clinic', 'staff', 'meds', 'proc', 'tpl', 'print', 'backup'];
var PERMS = [['Check in and manage the queue', true, true], ['Register and edit patients', true, false], ['Bill and collect Cash or UPI', true, true], ['Refill-only sales', true, false], ['Receive stock and record counts', true, false], ['Change medicine prices', false, true], ['Give discounts', false, true], ['Delete a bill', false, true]];
var ON = 'background: #EAF0FC; color: #1A4FB5';
var OFF = 'background: transparent; color: #5B6575';
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sec: 'staff', dirty: false, saved: '', perms: PERMS.map(function (x) { return x[1]; }), print: { paper: 'A4', copies: '1 copy', receipt: '80 mm receipt printer', lang: 'English + Tamil' } }; }
  renderVals() {
    var self = this, s = this.state, sec = SECTIONS[s.sec];
    var dirty = function () { self.setState({ dirty: true, saved: '' }); };
    var printOpts = [['paper', 'Prescription paper', ['A4', 'A5']], ['copies', 'Copies per prescription', ['1 copy', '2 copies']], ['receipt', 'Receipts print on', ['80 mm receipt printer', 'A5 on letterhead']], ['lang', 'Patient instructions', ['English', 'English + Tamil']]];
    return {
      sections: ORDER.map(function (k) { return { label: SECTIONS[k].label, st: k === s.sec ? 'background: #FFFFFF; color: #141C2B; font-weight: 600' : 'background: transparent; color: #5B6575', pick: function () { self.setState({ sec: k, dirty: false, saved: '' }); } }; }),
      title: sec.label, intro: sec.intro,
      hasFields: !!sec.fields, fields: (sec.fields || []).map(function (f) { return { label: f[0], value: f[1], span: f[2] ? 'grid-column: 1 / -1' : '' }; }),
      hasRows: !!sec.rows, rows: (sec.rows || []).map(function (r) { return Object.assign({ rightSt: 'color: #141C2B' }, r); }), addLabel: sec.add || '',
      isStaff: s.sec === 'staff',
      perms: PERMS.map(function (p, i) { return { label: p[0] + (p[2] && !p[1] ? ' — doctor only' : ''), on: s.perms[i], locked: p[2], st: p[2] && !p[1] ? 'color: #7A8494' : 'color: #141C2B',
        toggle: function () { if (p[2]) return; var np = s.perms.slice(); np[i] = !np[i]; self.setState({ perms: np, dirty: true, saved: '' }); } }; }),
      isPrint: s.sec === 'print',
      printOpts: printOpts.map(function (po) { return { label: po[1], opts: po[2].map(function (o) { return { label: o, st: s.print[po[0]] === o ? ON : OFF, pick: function () { var np = Object.assign({}, s.print); np[po[0]] = o; self.setState({ print: np, dirty: true, saved: '' }); } }; }) }; }),
      markDirty: dirty, dirty: s.dirty,
      save: function () { self.setState({ dirty: false, saved: 'saving' }); setTimeout(function () { self.setState({ saved: 'done' }); }, 600); },
      discard: function () { self.setState({ dirty: false }); },
      savedText: s.dirty ? 'Unsaved changes' : s.saved === 'saving' ? 'Saving…' : s.saved === 'done' ? 'Saved' : '',
      savedSt: s.dirty ? AMB + '; font-weight: 600' : s.saved === 'done' ? GRN + '; font-weight: 600' : 'color: #7A8494'
    };
  }
}
</script>
</body>
</html>
