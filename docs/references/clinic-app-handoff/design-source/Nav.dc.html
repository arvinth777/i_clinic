<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clinic top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; min-height: 56px; box-sizing: border-box; padding: 8px 28px; background: #FFFFFF; border-bottom: 1px solid #EEF0F3; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #141C2B; font-variant-numeric: tabular-nums">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px">
<a href="Map.dc.html" style="font-weight: 700; font-size: 15px; color: #141C2B; text-decoration: none">Salem Pain &amp; Palliative Care</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="8">
<a href="{{l.href}}" aria-current="{{l.current}}" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; text-decoration: none; {{l.st}}">{{l.label}}</a>
</sc-for>
</nav>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 14px">
<sc-if value="{{hasEvent}}" hint-placeholder-val="{{ false }}">
<span style="font-weight: 600; color: #1A4FB5">{{event}}</span>
</sc-if>
<a href="Reception.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; background: #F6F7F9; color: #141C2B; text-decoration: none">
<span style="width: 7px; height: 7px; border-radius: 50%; {{dotSt}}"></span>
<b>Now #{{token}}</b><span style="color: #7A8494">{{waiting}} waiting</span>
</a>
<span style="display: flex; align-items: center; gap: 6px; {{syncSt}}">{{syncText}}</span>
<span style="color: #5B6575">{{user}}</span>
<a href="Lock.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 8px; color: #5B6575; font-size: 14px; text-decoration: none">Lock</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["reception","doctor","billing","refill","patients","inventory","reports","more"],"default":"reception"},"user":{"editor":"text","default":"Reception · Selvi"},"sync":{"editor":"enum","options":["saved","saving","offline"],"default":"saved"},"token":{"editor":"int","default":14},"waiting":{"editor":"int","default":6},"event":{"editor":"text","default":""},"$preview":{"width":1440,"height":56}}'>
var LINKS = [
  { k: 'reception', label: 'Reception', href: 'Reception.dc.html' },
  { k: 'doctor', label: 'Doctor', href: 'Doctor.dc.html' },
  { k: 'billing', label: 'Billing', href: 'Billing.dc.html' },
  { k: 'refill', label: 'Refills', href: 'Refill.dc.html' },
  { k: 'patients', label: 'Patients', href: 'Patient.dc.html' },
  { k: 'inventory', label: 'Inventory', href: 'Inventory.dc.html' },
  { k: 'reports', label: 'Reports', href: 'Reports.dc.html' },
  { k: 'more', label: 'More', href: 'More.dc.html' }
];
class Component extends DCLogic {
  renderVals() {
    var p = this.props, active = p.active || 'reception', sync = p.sync || 'saved';
    return {
      links: LINKS.map(function (l) {
        var on = l.k === active;
        return { label: l.label, href: l.href, current: on ? 'page' : 'false',
          st: on ? 'color: #141C2B; font-weight: 600; background: #F2F4F7' : 'color: #5B6575' };
      }),
      token: p.token == null ? 14 : p.token,
      waiting: p.waiting == null ? 6 : p.waiting,
      user: p.user || 'Reception · Selvi',
      event: p.event || '', hasEvent: !!p.event,
      dotSt: sync === 'offline' ? 'background: #B4BBC6' : 'background: #22A55B',
      syncText: sync === 'offline' ? 'Offline · 2 changes waiting' : sync === 'saving' ? 'Saving…' : 'All saved',
      syncSt: sync === 'offline' ? 'color: #B42318; font-weight: 600' : sync === 'saving' ? 'color: #93520A; font-weight: 600' : 'color: #7A8494'
    };
  }
}
</script>
</body>
</html>
