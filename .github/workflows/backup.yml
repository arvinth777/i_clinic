name: Weekly database backup

# GitHub Actions, not Vercel cron (docs/build-plan.md item 8) -- Vercel
# Hobby cron is once-daily and can't shell out to pg_dump/age/aws anyway.
# Runs Sunday 20:00 UTC (01:30 IST Monday) -- outside the clinic's 10am-3pm
# hours and outside the 10am-before/3pm-after deploy window
# (docs/architecture-spec.md), so a slow or failing run never competes
# with a live clinic day.
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch: {} # manual trigger, for the restore-drill / a re-run after a fix

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pg_dump refuses a server newer than itself, and the runner's default client is older than Supabase's
      # Postgres (17.x). Keep this major version equal to the Supabase project's.
      - name: Install age and the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install awscli
        run: pip install --quiet awscli

      - name: Run backup
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/backup.sh
