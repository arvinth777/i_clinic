<!doctype html><html><head><meta charset="utf-8"><title>Archive rendering checks</title></head><body><main><h1>Synthetic PDF checks</h1><button id="short">Short prescription</button><button id="typical">Typical prescription</button><button id="long">Continuation prescription</button><button id="receipt">Receipt</button><button id="long-receipt">Long receipt</button><button id="staging-job">Staging issued snapshot</button><p id="result"></p></main><script type="module">
import '/src/index.css';import {renderArchivePdf} from '/src/lib/documentArchivePdf.tsx';
const clinic={name:'SYNTHETIC clinic',address:'Test address',phone:'0000000000',doctor_name:'Dr. Synthetic',doctor_registration_number:'TEST',upi_vpa:null};
const visit={id:'synthetic',token_number:123,stage:'ready_to_bill',arrived_at:'2026-10-17T08:00:00Z',complaint:'Synthetic pain complaint',diagnosis:'Synthetic diagnosis',advice:'Synthetic advice only. Not for clinical use.',follow_up_date:'2026-10-24',patients:{name:'Synthetic Patient',age:40,gender:'Male',height_cm:170,weight_kg:70}};
for(const name of ['short','typical','long','receipt','long-receipt'])document.getElementById(name).onclick=async()=>{const result=document.getElementById('result');result.textContent='Preparing…';try{const count=name==='long'?45:name==='typical'?6:1;const medicines=Array.from({length:count},(_,i)=>({kind:'medicine',description:`Synthetic medicine ${i+1}`,strength:'500 mg',drug_type:'tablet',dosage_frequency:'1-0-1',duration_days:5,before_after_food:'After food',notes:`Synthetic instruction ${i+1}`,unit_price_paise:1000}));const snapshot=name.includes('receipt')?{kind:'receipt',clinic,visit,billable:[...(name==='long-receipt'?Array.from({length:70},(_,i)=>({kind:'medicine',description:`Synthetic item ${i+1}`,quantity:1,stock_unit:'tablet',unit_price_paise:1000,line_total_paise:1000})):[]),{kind:'consultation',description:'Consultation',quantity:1,unit_price_paise:25000,line_total_paise:25000},{kind:'medicine',description:'Synthetic medicine',quantity:3,stock_unit:'tablet',unit_price_paise:1000,line_total_paise:3000}],amountPaise:name==='long-receipt'?97000:27000,discountPaise:1000,bill:{id:'test',final_amount_paise:name==='long-receipt'?97000:27000,payment_method:'upi',confirmed_at:'2026-10-17T08:00:00Z'}}:{kind:'prescription',clinic,visit,medicines};const blob=await renderArchivePdf(snapshot);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`archive-${name}.pdf`;a.click();result.textContent=`Ready: ${name}, ${blob.size} bytes`;}catch(e){result.textContent=e.message}};
document.getElementById('staging-job').onclick=async()=>{const result=document.getElementById('result');result.textContent='Preparing staging snapshot…';try{const job=await(await fetch('/archive-staging-fixture.json')).json();const blob=await renderArchivePdf(job.snapshot);const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='archive-staging-issued.pdf';link.click();result.textContent=`Ready: issued ${job.kind}, ${blob.size} bytes`;}catch(error){result.textContent=error.message}};
</script></body></html>
